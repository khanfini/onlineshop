{% load storefront_extras %}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Product","name":{{ product.name|json_value }},"sku":{{ product.code|json_value }},"description":{{ product.descriptions|json_value }},{% if product.image %}"image":"{{ request.scheme }}://{{ request.get_host }}{{ product.image.url }}",{% endif %}"offers":{"@type":"Offer","priceCurrency":"IRR","price":"{{ product.price }}","availability":"{% if product.is_in_stock %}https://schema.org/InStock{% else %}https://schema.org/OutOfStock{% endif %}","url":"{{ request.scheme }}://{{ request.get_host }}{{ product.get_absolute_url }}"}}</script>
